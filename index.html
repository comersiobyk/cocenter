<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Co Center</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="crossorigin" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&amp;display=swap" rel="stylesheet">
  <style type="text/css">
    * { box-sizing: border-box !important; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace !important; }
    html, body { width: 100% !important; height: 100vh !important; background-color: #05060a !important; background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh9DocQHrQw9p05Lbkght7m-rpO8O2HS6s3VG28Nc7FW6LPePf_AYJ3E104I15aD8OUsQRINz7QGbgv7EeJXKZKXdecQ-RAHvowdbS5vPqDrfZ63ZC3w-FOPKWPcVBKY5IFdenDmRixqc-Jy8BvVpAp6ReI7Io5UdxjNnlzY_TZLuTW6xaepq9RkRMA92kV/s1600/11.gif') !important; background-repeat: no-repeat !important; background-position: center center !important; background-size: cover !important; background-attachment: fixed !important; color: #fff !important; overflow: hidden !important; position: fixed; }
    a { color: inherit; }
    img { max-width: 100%; }

    .cc-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; background: rgba(3,4,8,.82); z-index: 0; pointer-events: none; }

    :root { --rgb1: #ff2d6a; --rgb2: #ffd23f; --rgb3: #29e0c9; --rgb4: #7c5cff; --rgb5: #ff2d6a; }
    @keyframes rgbStroke { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    @property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    @keyframes ccAngle { to { --angle: 360deg; } }

    /* ===== SLIDER ===== */
    .cc-slider-viewport {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .cc-slider-track {
      display: flex;
      width: 200vw;
      height: 100%;
      transition: transform .45s cubic-bezier(.4,0,.2,1);
      transform: translateX(0);
    }
    .cc-slider-track.at-slide-2 { transform: translateX(-100vw); }

    .cc-slide {
      width: 100vw;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .cc-slide-title { font-size: clamp(38px,10vw,64px); font-weight: 800; letter-spacing: -1px; color: #fff; margin-bottom: 14px; }
    .cc-slide-sub { max-width: 480px; color: #a9b2c3; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }

    /* swipe hint on slide 1 */
    .cc-swipe-hint { display: flex; align-items: center; gap: 8px; color: #ffd23f; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; opacity: .9; }
    .cc-swipe-hint svg { width: 18px; height: 18px; fill: #ffd23f; animation: ccSwipeMove 1.4s ease-in-out infinite; }
    @keyframes ccSwipeMove { 0%,100% { transform: translateX(0); opacity: .5; } 50% { transform: translateX(8px); opacity: 1; } }

    /* masuk button on slide 2 */
    .cc-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 15px 34px; overflow: hidden; isolation: isolate; color: #f5f7fa; background: #121420; border: 0; border-radius: 999px; font-size: 15px; font-weight: 800; text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .15s ease; letter-spacing: .5px; }
    .cc-btn:active { transform: scale(.96); }
    .cc-btn-fill { position: absolute; inset: 2px; z-index: -1; background: #121420; border-radius: 999px; }
    .cc-btn-label { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; }
    .cc-btn::before { content: ''; position: absolute; inset: 0; z-index: -2; padding: 2px; background: conic-gradient( from var(--angle,0deg), var(--rgb1), var(--rgb2), var(--rgb3), var(--rgb4), var(--rgb5) ); border-radius: 999px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .85; animation: ccAngle 4s linear infinite; }

    /* ===== DOTS ===== */
    .cc-dots { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; }
    .cc-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .25s ease, width .25s ease; }
    .cc-dot.active { background: #ffd23f; width: 20px; border-radius: 5px; }

    /* ===== NAV ARROW BUTTONS ===== */
    .cc-nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .3s ease, transform .2s ease, background .2s ease, visibility .3s ease;
      opacity: 0;
      visibility: hidden;
    }
    .cc-nav-arrow.show { opacity: 1; visibility: visible; }
    .cc-nav-arrow:active { transform: translateY(-50%) scale(.9); background: rgba(255,255,255,.15); }
    .cc-nav-arrow svg { width: 20px; height: 20px; stroke: #ffd23f; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .cc-arrow-right { right: 18px; }
    .cc-arrow-left { left: 18px; }

    @media screen and (max-width: 600px) {
      .cc-slide { padding: 30px 18px; }
      .cc-slide-title { font-size: clamp(32px,13vw,48px); }
      .cc-slide-sub { font-size: 13px; }
      .cc-nav-arrow { width: 40px; height: 40px; }
    }
  </style>
</head>

<body>
  <div class="cc-overlay"></div>

  <div class="cc-slider-viewport" id="cc-viewport">
    <div class="cc-slider-track" id="cc-track">

      <!-- SLIDE 1: GREETING -->
      <div class="cc-slide">
        <div class="cc-slide-title">Halo! 👋</div>
        <p class="cc-slide-sub">
          Selamat datang di <strong style="color:#fff;">Co Center</strong> — platform membership eksklusif buat akses layanan premium & paket kuota terbaik.
        </p>
        <div class="cc-swipe-hint">
          Geser untuk lanjut
          <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </div>
      </div>

      <!-- SLIDE 2: MASUK -->
      <div class="cc-slide">
        <div class="cc-slide-title">Siap Masuk?</div>
        <p class="cc-slide-sub">
          Klik tombol di bawah buat lanjut ke menu utama dan lihat semua paket kuota dan Membership App yang tersedia.
        </p>
        <a class="cc-btn" href="menu.html">
          <span class="cc-btn-fill"></span>
          <span class="cc-btn-label">Masuk</span>
        </a>
      </div>

    </div>
  </div>

  <!-- DOTS -->
  <div class="cc-dots">
    <div class="cc-dot active" id="cc-dot-0"></div>
    <div class="cc-dot" id="cc-dot-1"></div>
  </div>

  <!-- ARROW BUTTONS -->
  <div class="cc-nav-arrow cc-arrow-right show" id="cc-arrow-right">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>
  <div class="cc-nav-arrow cc-arrow-left" id="cc-arrow-left">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </div>

  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
      var track = document.getElementById('cc-track');
      var viewport = document.getElementById('cc-viewport');
      var arrowRight = document.getElementById('cc-arrow-right');
      var arrowLeft = document.getElementById('cc-arrow-left');
      var dots = [document.getElementById('cc-dot-0'), document.getElementById('cc-dot-1')];

      var currentSlide = 0;
      var totalSlides = 2;

      function goToSlide(index) {
        if (index < 0) index = 0;
        if (index > totalSlides - 1) index = totalSlides - 1;
        currentSlide = index;

        track.classList.toggle('at-slide-2', currentSlide === 1);

        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentSlide);
        });

        arrowRight.classList.toggle('show', currentSlide < totalSlides - 1);
        arrowLeft.classList.toggle('show', currentSlide > 0);
      }

      arrowRight.addEventListener('click', function (e) {
        e.stopPropagation();
        goToSlide(currentSlide + 1);
      });

      arrowLeft.addEventListener('click', function (e) {
        e.stopPropagation();
        goToSlide(currentSlide - 1);
      });

      // ===== SWIPE (touch) =====
      var touchStartX = 0;
      var touchStartY = 0;
      var touchEndX = 0;
      var touchEndY = 0;
      var isSwiping = false;

      viewport.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
        isSwiping = true;
      }, { passive: true });

      viewport.addEventListener('touchend', function (e) {
        if (!isSwiping) return;
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipeGesture();
        isSwiping = false;
      }, { passive: true });

      function handleSwipeGesture() {
        var deltaX = touchEndX - touchStartX;
        var deltaY = touchEndY - touchStartY;
        var minSwipeDistance = 50;

        // pastikan gesture horizontal, bukan scroll vertikal
        if (Math.abs(deltaX) < minSwipeDistance) return;
        if (Math.abs(deltaX) < Math.abs(deltaY)) return;

        if (deltaX < 0) {
          // swipe ke kiri -> next slide
          goToSlide(currentSlide + 1);
        } else {
          // swipe ke kanan -> prev slide
          goToSlide(currentSlide - 1);
        }
      }

      // ===== SWIPE (mouse drag, buat desktop) =====
      var mouseStartX = 0;
      var mouseEndX = 0;
      var isDragging = false;

      viewport.addEventListener('mousedown', function (e) {
        mouseStartX = e.screenX;
        isDragging = true;
      });

      viewport.addEventListener('mouseup', function (e) {
        if (!isDragging) return;
        mouseEndX = e.screenX;
        isDragging = false;
        var deltaX = mouseEndX - mouseStartX;
        if (Math.abs(deltaX) < 50) return;
        if (deltaX < 0) {
          goToSlide(currentSlide + 1);
        } else {
          goToSlide(currentSlide - 1);
        }
      });

      // ===== KEYBOARD ARROW (opsional, enak buat testing desktop) =====
      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
        if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
      });

      goToSlide(0);
    });
  </script>
</body>
</html>
