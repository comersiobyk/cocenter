  var currentOperator = "Indosat";

  function renderAccordion() {
    var container = document.getElementById('cc-accordion-container');
    var titleEl = document.getElementById('cc-current-op-title');
    titleEl.innerText = "Pilih Kategori: " + currentOperator;

    var categories = [
      { id: "hemat", title: "Kuota Hemat", priceRange: "Paket irit & harian" },
      { id: "untung", title: "Untung Banyak", priceRange: "Porsi besar harga terbaik" },
      { id: "akhirbulan", title: "Kuota Akhir Bulan", priceRange: "Bulanan & kuota monster" }
    ];

    var config = OPERATOR_CONFIG[currentOperator] || { link: "#", bgImg: "" };
    var targetUrl = config.link;
    var cardBgStyle = config.bgImg ? 'background-image: url(\'' + config.bgImg + '\');' : '';

    var html = '';
    categories.forEach(function(cat, index) {
      var catItems = ALL_PACKETS.filter(function(p) {
        return p.op === currentOperator && p.cat === cat.id;
      });

      var isOpen = index === 0 ? ' open' : '';
      html += '<div class="cc-acc-card' + isOpen + '" style="' + cardBgStyle + '">' +
                '<div class="cc-acc-header">' +
                  '<div class="cc-acc-info">' +
                    '<div class="cc-acc-title">' + cat.title + '</div>' +
                    '<div class="cc-acc-price-info">' + cat.priceRange + '</div>' +
                  '</div>' +
                  '<div class="cc-acc-arrow">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
                  '</div>' +
                '</div>' +
                '<div class="cc-acc-body">' +
                  '<div class="cc-paket-list">';

      if (catItems.length === 0) {
        html += '<div class="cc-empty-msg">Belum ada paket untuk kategori ini.</div>';
      } else {
        catItems.forEach(function(item) {
          var badgeHtml = item.badge ? '<span class="cc-paket-badge">' + item.badge + '</span>' : '';
          html += '<a class="cc-paket-card" href="' + targetUrl + '">' +
                    '<div class="cc-paket-head">' +
                      '<span class="cc-paket-name">' + item.name + badgeHtml + '</span>' +
                      '<span class="cc-paket-price">' + item.price + '</span>' +
                    '</div>' +
                    '<div class="cc-paket-sub">' + item.sub + '</div>' +
                  '</a>';
        });
      }

      html +=     '</div>' +
                '</div>' +
              '</div>';
    });

    container.innerHTML = html;

    // Pasang ulang event akordion
    var cards = container.querySelectorAll('.cc-acc-card');
    cards.forEach(function(card) {
      var header = card.querySelector('.cc-acc-header');
      header.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = card.classList.contains('open');
        cards.forEach(function(c) { c.classList.remove('open'); });
        if (!isOpen) {
          card.classList.add('open');
        }
      });
    });
  }

  // Interaksi Tombol Operator (Pills)
  var opPills = document.querySelectorAll('.cc-op-pill');
  var opWrapper = document.getElementById('cc-op-wrapper');

  opPills.forEach(function(pill) {
    pill.addEventListener('click', function(e) {
      e.stopPropagation();
      opPills.forEach(function(p) { p.classList.remove('cc-op-active'); });
      pill.classList.add('cc-op-active');

      currentOperator = pill.dataset.op;
      renderAccordion();

      // Geser center pill aktif di layar kecil
      var wrapRect = opWrapper.getBoundingClientRect();
      var pillRect = pill.getBoundingClientRect();
      var offset = (pillRect.left + pillRect.width / 2) - (wrapRect.left + wrapRect.width / 2);
      opWrapper.scrollLeft += offset;
    });
  });

  // Navbar Menu Toggle
  var trigger = document.getElementById('menu-trigger');
  var menu = document.getElementById('menu');
  var rotation = 0;

  trigger.onclick = function (e) {
    e.stopPropagation();
    menu.classList.toggle('active');
    rotation += 180;
    trigger.style.setProperty('--rot', rotation + 'deg');
  };

  document.addEventListener('click', function () {
    menu.classList.remove('active');
  });

  menu.querySelectorAll('a').forEach(function (link) {
    link.addEventListener('click', function (e) { e.stopPropagation(); });
  });

  // Render awal (Default: Indosat)
  renderAccordion();

});
</script>
