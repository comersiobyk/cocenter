<style>
  #cc-container, #cc-container * {
    font-family: 'JetBrains Mono', monospace !important;
    box-sizing: border-box;
  }

  html, body {
    margin: 0 !important; padding: 0 !important; height: 100% !important;
    overflow: hidden !important; background: #05060a !important; color: #fff;
  }

  #cc-container {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 999999; background: #05060a; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-top: 75px;
    padding-bottom: 120px;
  }

  /* ================= VARIAN BACKGROUND ================= */
  .cc-bg.bg-default {
    position: fixed; inset: 0; z-index: -1;
    background: #000 url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh9DocQHrQw9p05Lbkght7m-rpO8O2HS6s3VG28Nc7FW6LPePf_AYJ3E104I15aD8OUsQRINz7QGbgv7EeJXKZKXdecQ-RAHvowdbS5vPqDrfZ63ZC3w-FOPKWPcVBKY5IFdenDmRixqc-Jy8BvVpAp6ReI7Io5UdxjNnlzY_TZLuTW6xaepq9RkRMA92kV/s1600/11.gif') no-repeat center center;
    background-size: cover;
    transition: background 0.3s ease;
  }
  .cc-overlay.bg-default {
    position: fixed; inset: 0; z-index: -1; background: rgba(3,4,8,0.78);
    transition: background 0.3s ease;
  }

  .cc-bg.bg-simple {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(135deg, #090a0f 0%, #12151f 50%, #1a1614 100%) !important;
    background-size: cover;
    transition: background 0.3s ease;
  }
  .cc-overlay.bg-simple {
    position: fixed; inset: 0; z-index: -1;
    background: rgba(12, 10, 8, 0.65) !important;
    backdrop-filter: blur(10px);
    transition: background 0.3s ease;
  }

  /* ============ NAVIGASI BRAND & PROFILE DROPDOWN (STATIS DI ATAS) ============ */
  .cc-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    z-index: 100;
    background: rgba(5, 6, 10, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .cc-brand-wrap { display:flex; flex-direction:column; gap:2px; }
  .cc-brand-row { display:flex; align-items:center; gap:12px; }
  .cc-brand { font-weight:800; font-size:18px; color:#fff; letter-spacing:-0.5px; }
  .cc-subtitle {
    font-size: 10px; font-weight:700; color:#a9b2c3;
    letter-spacing: 2px; text-transform: uppercase; margin-left: 47px;
  }

  .cc-img {
    width:35px; height:35px; border-radius:10px; cursor:pointer;
    object-fit: cover;
    transition: transform 0.5s ease;
    transform: rotate(var(--rot, 0deg));
  }

  .cc-nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .cc-profile-wrap {
    position: relative;
  }
  .cc-profile-btn {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(255, 210, 63, 0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #151824;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cc-profile-btn svg {
    width: 20px;
    height: 20px;
    fill: #ffd23f;
  }
  .cc-profile-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cc-profile-btn:active {
    transform: scale(0.92);
  }
  .cc-profile-btn:hover {
    border-color: #ffd23f;
    background: rgba(255, 210, 63, 0.1);
  }

  .cc-profile-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 180px;
    background: #0d0f16;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    padding: 6px;
    z-index: 100000;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  }
  .cc-profile-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .cc-profile-dropdown a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    color: #d5dae3;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cc-profile-dropdown a svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }
  .cc-profile-dropdown a:hover {
    background: rgba(41, 224, 201, 0.1);
    color: #29e0c9;
  }
  .cc-profile-dropdown .cc-dropdown-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
    margin: 4px 0;
  }
  .cc-profile-dropdown a.cc-logout {
    color: #ff2d6a;
  }
  .cc-profile-dropdown a.cc-logout:hover {
    background: rgba(255, 45, 106, 0.1);
    color: #ff2d6a;
  }

  .cc-menu {
    position: absolute; top: 65px; left: 30px;
    background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px;
    z-index: 100; opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .cc-menu.active { opacity: 1; visibility: visible; }
  .cc-menu a {
    display: block; padding: 12px 15px; color: #fff; text-decoration: none;
    font-size: 13px; font-weight:700; border-radius: 10px;
    opacity: 0; transform: translateY(-8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .cc-menu.active a { opacity: 1; transform: translateY(0); }
  .cc-menu.active a:nth-child(1) { transition-delay: 0.05s; }
  .cc-menu.active a:nth-child(2) { transition-delay: 0.15s; }
  .cc-menu.active a:nth-child(3) { transition-delay: 0.25s; }
  .cc-menu.active a:nth-child(4) { transition-delay: 0.35s; }
  .cc-menu a:hover { background: rgba(255,255,255,0.1); }

  @keyframes rgbStroke {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .cc-section { padding: 0 30px 30px; }
  .cc-section-title {
    font-weight:800; color:#29e0c9; margin-bottom:15px; font-size:12px;
    text-transform:uppercase; letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }
  .cc-section-title::after {
    content:''; flex:1; height:1px; background: rgba(41,224,201,0.25);
  }

  /* ===== OPERATOR PILLS (FILTER UTAMA) ===== */
  .cc-op-wrapper {
    display: flex;
    overflow-x: auto;
    gap: 12px;
    margin: 15px 30px 20px;
    margin-top: 20px;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .cc-op-wrapper::-webkit-scrollbar { display: none; }

  .cc-op-pill {
    flex: 0 0 auto;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: #ffd23f;
    background: #0b1226;
    border: 1.5px solid #ffd23f;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cc-op-pill:active { transform: scale(0.95); }
  .cc-op-pill.cc-op-active {
    background: #ffd23f;
    color: #0b1226;
  }

  /* ===== AKORDION / CARD KATEGORI ===== */
  .cc-accordion-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 15px;
  }

  .cc-acc-card {
    border-radius: 20px;
    overflow: hidden;
    background-color: #150c22;
    border: 2px solid transparent;
    background-clip: padding-box;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }

  .cc-acc-bgimg {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 84px;
    background-size: cover;
    background-position: left center;
    background-repeat: no-repeat;
    z-index: 0;
    pointer-events: none;
  }

  .cc-acc-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 84px;
    background: linear-gradient(90deg, rgba(15, 10, 25, 0.92) 0%, rgba(15, 10, 25, 0.75) 45%, rgba(15, 10, 25, 0.3) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .cc-acc-card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    padding: 2px;
    background: linear-gradient(90deg, #ff2d6a, #ffd23f, #29e0c9, #7c5cff, #ff2d6a);
    background-size: 200% 200%;
    animation: rgbStroke 4s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 3;
  }

  .cc-acc-header, .cc-acc-body {
    position: relative;
    z-index: 2;
  }

  .cc-acc-header {
    padding: 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }

  .cc-acc-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cc-acc-title {
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    letter-spacing: -0.3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .cc-acc-price-info {
    font-size: 12px;
    color: #ffd23f;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  .cc-acc-arrow {
    width: 32px; height: 32px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    flex-shrink: 0;
  }

  .cc-acc-card.open .cc-acc-arrow {
    transform: rotate(180deg);
  }

  .cc-acc-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), padding 0.35s ease;
    background: rgba(13, 15, 22, 0.85);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 0 20px;
  }

  .cc-acc-card.open .cc-acc-body {
    max-height: 1500px;
    padding: 20px;
  }

  /* List Paket */
  .cc-paket-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cc-paket-card {
    text-decoration: none;
    display: block !important;
    background: rgba(13, 15, 22, 0.95);
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cc-paket-card:active { transform: scale(0.98); background: rgba(25, 28, 40, 0.95); }

  .cc-paket-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 4px;
  }

  .cc-paket-name {
    font-weight: 800;
    font-size: 12px;
    color: #fff;
    line-height: 1.3;
  }

  .cc-paket-price {
    font-weight: 800;
    font-size: 12px;
    color: #ffd23f;
    white-space: nowrap;
    background: rgba(255, 210, 63, 0.1);
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255, 210, 63, 0.25);
  }

  .cc-paket-sub {
    font-size: 10px;
    color: #a9b2c3;
    line-height: 1.4;
  }

  .cc-paket-badge {
    display: inline-block;
    background: rgba(41, 224, 201, 0.15);
    color: #29e0c9;
    font-size: 8px;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid rgba(41, 224, 201, 0.3);
    margin-left: 4px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  .cc-empty-msg {
    text-align: center;
    color: #a9b2c3;
    padding: 25px;
    font-size: 12px;
  }

  /* ============ BOTTOM FLOATING NAVBAR ============ */
  .cc-bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    background: rgba(13, 15, 22, 0.85);
    backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 999999;
    box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.4);
  }
  .cc-bottom-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    color: #a9b2c3;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cc-bottom-item svg {
    width: 22px;
    height: 22px;
    fill: #a9b2c3;
    transition: fill 0.2s ease, transform 0.2s ease;
  }
  .cc-bottom-item:active {
    transform: scale(0.92);
  }
  .cc-bottom-item:hover, .cc-bottom-item.active {
    color: #ffd23f;
  }
  .cc-bottom-item:hover svg, .cc-bottom-item.active svg {
    fill: #ffd23f;
  }
</style>
</head>

  var currentOperator = "Indosat";

  function renderAccordion() {
    var container = document.getElementById('cc-accordion-container');

    var categories = [
      { id: "hemat", title: "Kuota Hemat", priceRange: "Paket irit & harian" },
      { id: "untung", title: "Untung Banyak", priceRange: "Porsi besar harga terbaik" },
      { id: "akhirbulan", title: "Kuota Akhir Bulan", priceRange: "Bulanan & kuota monster" }
    ];

    var config = OPERATOR_CONFIG[currentOperator] || { link: "#", bgImg: "" };
    var targetUrl = config.link;
    var bgImgHtml = config.bgImg ? '<div class="cc-acc-bgimg" style="background-image: url(\'' + config.bgImg + '\');"></div>' : '';

    var html = '';
    categories.forEach(function(cat, index) {
      var catItems = ALL_PACKETS.filter(function(p) {
        return p.op === currentOperator && p.cat === cat.id;
      });

      var isOpen = index === 0 ? ' open' : '';
      html += '<div class="cc-acc-card' + isOpen + '">' +
                bgImgHtml +
                '<div class="cc-acc-header">' +
                  '<div class="cc-acc-info">' +
                    '<div class="cc-acc-title">' + cat.title + '</div>' +
                    '<div class="cc-acc-price-info">' + cat.priceRange + '</div>' +
                  '</div>' +
                  '<div class="cc-acc-arrow">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
                  '</div>' +
                '</div>' +
                '<div class="cc-acc-body">' +
                  '<div class="cc-paket-list">';

      if (catItems.length === 0) {
        html += '<div class="cc-empty-msg">Belum ada paket untuk kategori ini.</div>';
      } else {
        catItems.forEach(function(item) {
          var badgeHtml = item.badge ? '<span class="cc-paket-badge">' + item.badge + '</span>' : '';
          html += '<a class="cc-paket-card" href="' + targetUrl + '">' +
                    '<div class="cc-paket-head">' +
                      '<span class="cc-paket-name">' + item.name + badgeHtml + '</span>' +
                      '<span class="cc-paket-price">' + item.price + '</span>' +
                    '</div>' +
                    '<div class="cc-paket-sub">' + item.sub + '</div>' +
                  '</a>';
        });
      }

      html +=     '</div>' +
                '</div>' +
              '</div>';
    });

    container.innerHTML = html;

    var cards = container.querySelectorAll('.cc-acc-card');
    cards.forEach(function(card) {
      var header = card.querySelector('.cc-acc-header');
      header.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = card.classList.contains('open');
        cards.forEach(function(c) { c.classList.remove('open'); });
        if (!isOpen) {
          card.classList.add('open');
        }
      });
    });
  }

  var opPills = document.querySelectorAll('.cc-op-pill');
  var opWrapper = document.getElementById('cc-op-wrapper');

  opPills.forEach(function(pill) {

      currentOperator = pill.dataset.op;
      renderAccordion();

      var wrapRect = opWrapper.getBoundingClientRect();
      var pillRect = pill.getBoundingClientRect();
      var offset = (pillRect.left + pillRect.width / 2) - (wrapRect.left + wrapRect.width / 2);
      opWrapper.scrollLeft += offset;
    });
