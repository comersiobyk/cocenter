<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co Center - Profil Pengguna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { font-family: 'JetBrains Mono', monospace !important; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060a; color: #fff; overflow-y: auto;
  }
  .profile-container {
    max-width: 400px; margin: 40px auto; padding: 24px;
    background: #0d0f16; border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 20px;
  }
  .profile-header { text-align: center; font-weight: 800; font-size: 20px; color: #ffd23f; }
  .profile-card {
    background: #05060a; border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .profile-label { font-size: 11px; color: #a9b2c3; text-transform: uppercase; font-weight: 700; }
  .profile-value { font-size: 13px; font-weight: 700; color: #fff; word-break: break-all; }
  .btn-action {
    width: 100%; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 12px;
    cursor: pointer; border: none; text-align: center; text-decoration: none; display: block;
  }
  .btn-link { background: #ffd23f; color: #0b1226; }
  .btn-unlink { background: #ff2d6a; color: #fff; }
  .status-badge { font-size: 12px; font-weight: 800; }
  .status-linked { color: #4ade80; }
  .status-unlinked { color: #ff2d6a; }
</style>
</head>
<body>

<div class="profile-container">
  <div class="profile-header">Co Center Profile</div>

  <div class="profile-card">
    <div class="profile-label">Status Akun Google</div>
    <div class="profile-value">
      <span id="google-status-text" class="status-badge status-unlinked">Belum Dikaitkan</span>
    </div>
  </div>

  <div class="profile-card" id="email-card" style="display: none;">
    <div class="profile-label">Email Terhubung</div>
    <div class="profile-value" id="google-email-text">-</div>
  </div>

  <!-- Tombol Aksi Dinamis -->
  <div id="action-btn-container">
    <a href="login.html?type=google" class="btn-action btn-link" id="btn-toggle-link">Hubungkan Akun Google</a>
  </div>
</div>

<script>
  // Konfigurasi Supabase
  const SUPABASE_URL = 'https://xunmofaxuuqhtnyqwvir.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1bm1vZmF4dXVxaHRueXF3dmlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzgxMDAsImV4cCI6MjA1NjgxNDEwMH0.placeholder_anon_key';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener("DOMContentLoaded", async () => {
    // 1. Cek Sesi Aktif dari Supabase secara langsung biar akurat
    try {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session && session.user) {
        // Paksa simpan status valid ke localStorage
        localStorage.setItem('cc_google_linked', 'true');
        localStorage.setItem('cc_google_email', session.user.email || '');
      }
    } catch(e) {
      console.error("Session check error:", e);
    }

    // 2. Ambil Status dari localStorage
    const isLinked = localStorage.getItem('cc_google_linked') === 'true';
    const email = localStorage.getItem('cc_google_email') || 'Terhubung';

    const statusText = document.getElementById('google-status-text');
    const emailCard = document.getElementById('email-card');
    const emailText = document.getElementById('google-email-text');
    const btnToggle = document.getElementById('btn-toggle-link');

    if (isLinked) {
      // Kalau sudah terkait, ubah teks & tampilkan email
      statusText.innerText = 'Terkait';
      statusText.className = 'status-badge status-linked';
      
      emailCard.style.display = 'block';
      emailText.innerText = email;

      // Ubah tombol jadi opsi Putuskan / Logout
      btnToggle.innerText = 'Putuskan Akun Google';
      btnToggle.className = 'btn-action btn-unlink';
      btnToggle.href = '#';
      btnToggle.onclick = async (e) => {
        e.preventDefault();
        if (confirm("Yakin ingin memutuskan akun Google?")) {
          await _supabase.auth.signOut();
          localStorage.removeItem('cc_google_linked');
          localStorage.removeItem('cc_google_email');
          localStorage.removeItem('cc_temp_google_name');
          localStorage.removeItem('cc_temp_google_avatar');
          location.reload();
        }
      };
    } else {
      // Kalau belum terkait
      statusText.innerText = 'Belum Dikaitkan';
      statusText.className = 'status-badge status-unlinked';
      emailCard.style.display = 'none';
      btnToggle.innerText = 'Hubungkan Akun Google';
      btnToggle.className = 'btn-action btn-link';
      btnToggle.href = 'login.html?type=google';
    }
  });
</script>

</body>
</html>
