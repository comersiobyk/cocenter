<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co Center - Profil Pengguna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
  #cc-container, #cc-container * {
    font-family: 'JetBrains Mono', monospace !important;
    box-sizing: border-box;
  }
  html, body {
    margin: 0 !important; padding: 0 !important; height: 100% !important;
    overflow: hidden !important; background: #05060a !important; color: #fff;
  }
  #cc-container {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 999999; background: #05060a; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: 90px;
  }
  .cc-bg.bg-default {
    position: fixed; inset: 0; z-index: -1;
    background: #000 url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh9DocQHrQw9p05Lbkght7m-rpO8O2HS6s3VG28Nc7FW6LPePf_AYJ3E104I15aD8OUsQRINz7QGbgv7EeJXKZKXdecQ-RAHvowdbS5vPqDrfZ63ZC3w-FOPKWPcVBKY5IFdenDmRixqc-Jy8BvVpAp6ReI7Io5UdxjNnlzY_TZLuTW6xaepq9RkRMA92kV/s1600/11.gif') no-repeat center center;
    background-size: cover;
  }
  .cc-overlay.bg-default { position: fixed; inset: 0; z-index: -1; background: rgba(3,4,8,0.78); }
  .cc-bg.bg-simple {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(135deg, #090a0f 0%, #12151f 50%, #1a1614 100%) !important;
    background-size: cover;
  }
  .cc-overlay.bg-simple {
    position: fixed; inset: 0; z-index: -1;
    background: rgba(12, 10, 8, 0.65) !important; backdrop-filter: blur(10px);
  }
  .cc-nav { display:flex; align-items:center; justify-content:space-between; padding:20px 30px 10px; }
  .cc-brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:18px; color:#fff; }
  .cc-img { width:35px; height:35px; border-radius:10px; }
  .cc-brand-wrap { display:flex; flex-direction:column; gap:2px; }
  .cc-brand-row { display:flex; align-items:center; gap:12px; }
  .cc-subtitle { font-size: 10px; font-weight:700; color:#a9b2c3; letter-spacing: 2px; text-transform: uppercase; margin-left: 47px; }
  
  .cc-settings-badge {
    display: flex; align-items: center; gap: 6px; background: rgba(255, 210, 63, 0.1);
    border: 1px solid rgba(255, 210, 63, 0.35); color: #ffd23f; font-weight: 800; font-size: 11px;
    padding: 6px 12px; border-radius: 20px; text-decoration: none;
  }
  .cc-settings-badge svg { width: 14px; height: 14px; fill: currentColor; }

  .cc-section { padding: 15px 30px; display: flex; flex-direction: column; align-items: center; }
  .cc-profile-box {
    width: 100%; max-width: 400px; background: #0d0f16; border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .cc-avatar-container {
    position: relative; width: 100px; height: 100px; border-radius: 50%; border: 2px solid #ffd23f;
    overflow: hidden; background: #151824; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cc-avatar-container img { width: 100%; height: 100%; object-fit: cover; }
  .cc-avatar-container svg { width: 40px; height: 40px; fill: #ffd23f; }
  .cc-avatar-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease;
  }
  .cc-avatar-container:hover .cc-avatar-overlay { opacity: 1; }
  .cc-avatar-overlay svg { width: 24px; height: 24px; fill: #fff; }

  .cc-form-group { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .cc-label { font-size: 11px; font-weight: 700; color: #a9b2c3; text-transform: uppercase; }
  .cc-input {
    width: 100%; background: #05060a; border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 13px; font-weight: 700; outline: none;
  }
  .cc-input:focus { border-color: #ffd23f; }

  .cc-link-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #05060a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px 14px; width: 100%;
  }
  .cc-link-info { display: flex; flex-direction: column; gap: 2px; max-width: 180px; }
  .cc-link-title { font-size: 12px; font-weight: 800; color: #fff; }
  .cc-link-status { font-size: 10px; font-weight: 700; color: #29e0c9; }
  .cc-link-email { font-size: 10px; color: #ffd23f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

  .cc-btn {
    padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; border: none;
    display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  }
  .cc-btn-primary { width: 100%; padding: 12px; border-radius: 12px; font-size: 12px; background: #ffd23f; color: #0b1226; }
  .cc-btn-action { background: rgba(41, 224, 201, 0.15); color: #29e0c9; border: 1px solid rgba(41, 224, 201, 0.4); }
  .cc-btn-unbind { background: rgba(255, 45, 106, 0.15); color: #ff2d6a; border: 1px solid rgba(255, 45, 106, 0.4); display: none; }

  .cc-crop-modal {
    position: fixed; inset: 0; z-index: 1000000; background: rgba(3,4,8,0.9); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease;
  }
  .cc-crop-modal.show { opacity: 1; visibility: visible; }
  .cc-crop-box {
    background: #0d0f16; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 20px; width: 100%; max-width: 340px;
    display: flex; flex-direction: column; align-items: center; gap: 15px;
  }
  .cc-crop-title { font-weight: 800; font-size: 13px; color: #ffd23f; text-transform: uppercase; }
  .cc-canvas-wrap {
    width: 260px; height: 260px; border: 2px dashed #29e0c9; border-radius: 12px; overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .cc-crop-actions { display: flex; gap: 10px; width: 100%; }

  .cc-toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(13, 15, 22, 0.95); border: 1px solid #ffd23f; color: #ffd23f;
    padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; z-index: 1000000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
  }
  .cc-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  .cc-bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100vw; background: rgba(13, 15, 22, 0.75); backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; justify-content: space-around;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 999999;
  }
  .cc-bottom-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #a9b2c3; font-size: 10px; font-weight: 700;
  }
  .cc-bottom-item svg { width: 22px; height: 22px; fill: #a9b2c3; }
  .cc-bottom-item.active { color: #ffd23f; }
  .cc-bottom-item.active svg { fill: #ffd23f; }
</style>
</head>
<body>

<div id="cc-container">
  <div class="cc-bg bg-default" id="cc-bg-element"></div>
  <div class="cc-overlay bg-default" id="cc-overlay-element"></div>

  <div class="cc-nav">
    <div class="cc-brand-wrap">
      <div class="cc-brand-row cc-brand">
        <img class="cc-img" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjgKAkQ6fTJOBPoOVz21klx2Vw6CXegaFe7QnvWoaDZTt1raufO5Ikvqu0JrP93QUf_iAcqVp8IkcTZjTx_e1mMqJENEYIpEjv-br9ApdDAeMiPcm8xoO-dFAmPJa-9y22yJdNme0Eb-EFxm-dS0Pd2UwUNu2cfB5pxS7KA7RP1JPKB-79xmqs5Vl9pSYHn/s1600/IMG_20260808_230713.png">
        CO CENTER
      </div>
      <div class="cc-subtitle">Profil Pengguna</div>
    </div>
    <a class="cc-settings-badge" href="pengaturan.html">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.47l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c-.24 0 .44-.17.47-.47l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Pengaturan
    </a>
  </div>

  <div class="cc-section">
    <div class="cc-profile-box">
      <div class="cc-avatar-container" id="trigger-file">
        <div id="avatar-preview-wrap" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        </div>
        <div class="cc-avatar-overlay">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
      </div>
      <input type="file" id="input-file" accept="image/*" style="display: none;">

      <div class="cc-form-group">
        <label class="cc-label">Nama Pengguna</label>
        <input type="text" class="cc-input" id="input-username" placeholder="Masukkan nama Anda...">
      </div>

      <div class="cc-form-group">
        <label class="cc-label">Integrasi Akun</label>
        
        <div class="cc-link-row">
          <div class="cc-link-info">
            <div class="cc-link-title">Google</div>
            <div class="cc-link-status" id="google-status">Belum dikaitkan</div>
            <div class="cc-link-email" id="google-account-email"></div>
          </div>
          <div style="display: flex; gap: 6px;">
            <a class="cc-btn cc-btn-action" id="btn-link-google" href="login.html?type=google">Kaitkan</a>
            <button class="cc-btn cc-btn-unbind" id="btn-unbind-google">Putuskan</button>
          </div>
        </div>

        <div class="cc-link-row" style="margin-top: 8px;">
          <div class="cc-link-info">
            <div class="cc-link-title">Comérsio Akun</div>
            <div class="cc-link-status" id="comersio-status">Belum dikaitkan</div>
            <div class="cc-link-email" id="comersio-account-email"></div>
          </div>
          <div style="display: flex; gap: 6px;">
            <a class="cc-btn cc-btn-action" id="btn-link-comersio" href="login.html?type=comersio">Kaitkan</a>
            <button class="cc-btn cc-btn-unbind" id="btn-unbind-comersio">Putuskan</button>
          </div>
        </div>
      </div>

      <button class="cc-btn cc-btn-primary" id="btn-save-profile">Simpan Perubahan</button>
    </div>
  </div>

  <div class="cc-crop-modal" id="crop-modal">
    <div class="cc-crop-box">
      <div class="cc-crop-title">Sesuaikan Foto (1:1)</div>
      <div class="cc-canvas-wrap"><canvas id="crop-canvas" width="240" height="240"></canvas></div>
      <div class="cc-crop-actions">
        <button class="cc-btn" id="btn-cancel-crop" style="background:rgba(255,255,255,0.1); color:#fff; width:100%;">Batal</button>
        <button class="cc-btn cc-btn-primary" id="btn-apply-crop" style="width:100%;">Gunakan Foto</button>
      </div>
    </div>
  </div>

  <div class="cc-toast" id="cc-toast">Profil berhasil disimpan!</div>

  <div class="cc-bottom-nav">
    <a class="cc-bottom-item" href="menu.html"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Menu</a>
    <a class="cc-bottom-item" href="https://lynk.id/cocenter" target="_blank"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>Lynk.id</a>
    <a class="cc-bottom-item" href="transaksi.html"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Transaksi</a>
    <a class="cc-bottom-item active" href="profile.html"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>Profile</a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var bgEl = document.getElementById('cc-bg-element');
  var overlayEl = document.getElementById('cc-overlay-element');
  var bgMode = localStorage.getItem('cc_bg_mode') || 'default';
  if (bgEl && overlayEl) {
    bgEl.className = 'cc-bg ' + (bgMode === 'sederhana' ? 'bg-simple' : 'bg-default');
    overlayEl.className = 'cc-overlay ' + (bgMode === 'sederhana' ? 'bg-simple' : 'bg-default');
  }

  // Tangkap data temp Google jika baru balik dari login.html
  var googleFetchedName = localStorage.getItem('cc_temp_google_name');
  var googleFetchedAvatar = localStorage.getItem('cc_temp_google_avatar');
  if (googleFetchedName) {
    localStorage.setItem('cc_user_name', googleFetchedName);
    localStorage.setItem('cc_google_linked', 'true');
    localStorage.removeItem('cc_temp_google_name');
  }
  if (googleFetchedAvatar) {
    localStorage.setItem('cc_user_avatar', googleFetchedAvatar);
    localStorage.removeItem('cc_temp_google_avatar');
  }

  var inputUsername = document.getElementById('input-username');
  var avatarPreviewWrap = document.getElementById('avatar-preview-wrap');
  var toast = document.getElementById('cc-toast');

  var savedName = localStorage.getItem('cc_user_name') || '';
  var savedAvatar = localStorage.getItem('cc_user_avatar') || '';
  var isGoogleLinked = localStorage.getItem('cc_google_linked') === 'true';
  var isComersioLinked = localStorage.getItem('cc_comersio_linked') === 'true';
  
  var googleEmail = localStorage.getItem('cc_google_email') || 'Akun Google Terkait';
  var comersioEmail = localStorage.getItem('cc_comersio_email') || '';

  if (inputUsername) inputUsername.value = savedName;
  if (savedAvatar && avatarPreviewWrap) {
    avatarPreviewWrap.innerHTML = '<img src="' + savedAvatar + '" alt="Avatar">';
  }

  // Cek Status Google
  var btnG = document.getElementById('btn-link-google');
  var btnUnbindG = document.getElementById('btn-unbind-google');
  if (isGoogleLinked) {
    document.getElementById('google-status').textContent = 'Terkait';
    document.getElementById('google-status').style.color = '#29e0c9';
    document.getElementById('google-account-email').textContent = googleEmail;
    btnG.style.display = 'none';
    btnUnbindG.style.display = 'flex';
  } else {
    document.getElementById('google-status').textContent = 'Belum dikaitkan';
    document.getElementById('google-status').style.color = '#a9b2c3';
    document.getElementById('google-account-email').textContent = '';
    btnG.style.display = 'flex';
    btnUnbindG.style.display = 'none';
  }

  // Cek Status Comérsio
  var btnC = document.getElementById('btn-link-comersio');
  var btnUnbindC = document.getElementById('btn-unbind-comersio');
  if (isComersioLinked) {
    document.getElementById('comersio-status').textContent = 'Terkait';
    document.getElementById('comersio-status').style.color = '#29e0c9';
    document.getElementById('comersio-account-email').textContent = comersioEmail;
    btnC.style.display = 'none';
    btnUnbindC.style.display = 'flex';
  } else {
    document.getElementById('comersio-status').textContent = 'Belum dikaitkan';
    document.getElementById('comersio-status').style.color = '#a9b2c3';
    document.getElementById('comersio-account-email').textContent = '';
    btnC.style.display = 'flex';
    btnUnbindC.style.display = 'none';
  }

  function showToast(msg) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }

  // Tombol Unbind Google
  btnUnbindG.addEventListener('click', function() {
    localStorage.removeItem('cc_google_linked');
    localStorage.removeItem('cc_google_email');
    showToast('Akun Google berhasil diputuskan!');
    setTimeout(function() { location.reload(); }, 1000);
  });

  // Tombol Unbind Comérsio
  btnUnbindC.addEventListener('click', function() {
    localStorage.removeItem('cc_comersio_linked');
    localStorage.removeItem('cc_comersio_email');
    showToast('Comérsio Akun berhasil diputuskan!');
    setTimeout(function() { location.reload(); }, 1000);
  });

  // CROPPER LOGIC
  var triggerFile = document.getElementById('trigger-file');
  var inputFile = document.getElementById('input-file');
  var cropModal = document.getElementById('crop-modal');
  var cropCanvas = document.getElementById('crop-canvas');
  var ctx = cropCanvas.getContext('2d');
  var imgObj = new Image();
  var imgX = 0, imgY = 0, imgScale = 1, isDragging = false, startMouseX = 0, startMouseY = 0;
  var finalCroppedBase64 = '';

  if (triggerFile && inputFile) {
    triggerFile.addEventListener('click', function() { inputFile.click(); });
    inputFile.addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          imgObj.onload = function() {
            var canvasSize = cropCanvas.width;
            if (imgObj.width > imgObj.height) {
              imgScale = canvasSize / imgObj.height;
              imgX = (canvasSize - (imgObj.width * imgScale)) / 2;
              imgY = 0;
            } else {
              imgScale = canvasSize / imgObj.width;
              imgX = 0;
              imgY = (canvasSize - (imgObj.height * imgScale)) / 2;
            }
            ctx.clearRect(0, 0, canvasSize, canvasSize);
            ctx.drawImage(imgObj, imgX, imgY, imgObj.width * imgScale, imgObj.height * imgScale);
            cropModal.classList.add('show');
          };
          imgObj.src = evt.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });
  }

  document.getElementById('btn-cancel-crop').addEventListener('click', function() {
    cropModal.classList.remove('show');
    inputFile.value = '';
  });

  document.getElementById('btn-apply-crop').addEventListener('click', function() {
    finalCroppedBase64 = cropCanvas.toDataURL('image/jpeg', 0.85);
    avatarPreviewWrap.innerHTML = '<img src="' + finalCroppedBase64 + '" alt="Avatar">';
    cropModal.classList.remove('show');
    inputFile.value = '';
    showToast('Foto dipotong (1:1)!');
  });

  document.getElementById('btn-save-profile').addEventListener('click', function() {
    var nameVal = inputUsername.value.trim();
    if (!nameVal) {
      showToast('Nama pengguna tidak boleh kosong!');
      return;
    }
    localStorage.setItem('cc_user_name', nameVal);
    localStorage.setItem('cc_is_logged', 'true');
    if (finalCroppedBase64) {
      localStorage.setItem('cc_user_avatar', finalCroppedBase64);
    }
    showToast('Perubahan profil disimpan!');
  });
});
</script>
</body>
</html>
